name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python evals/grade.py examples/yakuza/curated-report.json
      - run: python evals/grade.py evals/baselines/2026-10-23/full.json --scenario full
      - run: python evals/grade.py evals/baselines/2026-10-23/prefix.json
      - run: python scripts/build_skill.py --output dist/canonkeeper.zip
      - uses: actions/upload-artifact@v4
        with:
          name: canonkeeper-skill-python-${{ matrix.python }}
          path: dist/canonkeeper.zip
