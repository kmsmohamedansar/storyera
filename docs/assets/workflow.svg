<text x="389" y="222" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#182C35">Read</text>
<text x="389" y="280" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#52656C">Full passages</text>
<polyline points="643,245 663,245" fill="none" stroke="#267C72" stroke-width="4"/>
<polyline points="651,236 663,245 651,254" fill="none" stroke="#267C72" stroke-width="4"/>
