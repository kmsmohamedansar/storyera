<text x="993" y="222" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#182C35">Reconcile</text>
<text x="993" y="280" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#52656C">Later evidence</text>
<polyline points="1247,245 1267,245" fill="none" stroke="#267C72" stroke-width="4"/>
<polyline points="1255,236 1267,245 1255,254" fill="none" stroke="#267C72" stroke-width="4"/>
