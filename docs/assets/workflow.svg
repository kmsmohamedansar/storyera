<text x="691" y="178" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#267C72">03</text>
<text x="691" y="222" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#182C35">Ledger</text>
<text x="691" y="280" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#52656C">Facts + citations</text>
