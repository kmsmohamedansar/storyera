<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img"><title>The StoryEra audit workflow</title>
<rect width="1600" height="470" fill="#F6F2E9"/>
<text x="65" y="42" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#182C35">From chapter text to reviewable notes.</text>
<rect x="65" y="155" width="270" height="180" rx="14" fill="#FFFFFF"/>
